name: Gates y publicacion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# La concurrencia va POR JOB y no en el workflow: los gates se cancelan cuando
# llega un push nuevo —lo viejo ya no interesa— pero una publicacion a medias no
# se puede cancelar sin dejar la mitad de los paquetes en el registro.
#
# QUE CORRE CUANDO (ADR-139)
#
# El disparador sigue siendo cada push a main, pero el trabajo esta partido en
# dos y la linea que los separa es una sola condicion, repetida invertida:
#
#   `github.event_name == 'push' && !startsWith(head_commit.message, 'chore(release):')`
#
#   - se cumple  → push corriente a main: corre SOLO `guardia` (typecheck + lint).
#   - no se cumple → commit de release, PR o dispatch manual: corren los diez
#     gates, axe y —si ademas es un push a main— la publicacion.
#
# Las dos ramas son complementarias y nunca coinciden, asi que un commit de
# release no paga `guardia` ademas de `gates`: lo que uno cubre el otro lo cede.
#
# Por que el asunto del commit y no un filtro `paths`: con `paths` el run ni se
# creaba, y entonces tampoco habria guardia en los pushes corrientes. El marcador
# es fiable porque `scripts/release.mjs` exige el arbol limpio y main al dia antes
# de commitear, asi que el commit de release siempre es la cabeza del push.

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Lo barato en cada push: los dos gates que atrapan la mayoria de los errores
  # —un tipo que no cierra, una regla de lint— sin pagar el resto.
  #
  # No es gratis: `typecheck` y `lint` dependen de `^build` (turbo.json), asi que
  # construye los paquetes de los que cada workspace depende. Lo que se ahorra
  # frente a la pasada completa es todo lo demas: el build de las apps, el
  # prerenderizado de Next, storybook-static, Chromium, los tests, size-limit y
  # los dos presupuestos.
  guardia:
    name: typecheck · lint
    if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: guardia-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Guardia
        run: pnpm turbo typecheck lint --continue

  # Ocho de los nueve gates de docs/03 §4, en una sola pasada de turbo.
  #
  # `--continue` es deliberado: sin el, turbo para en el primer fallo y quien
  # abre el PR descubre los gates de uno en uno, un push por gate. Con el, la
  # primera vuelta ya dice todo lo que hay que arreglar.
  gates:
    name: build · typecheck · lint · test · size · slots · contrast · docs · budget
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: gates-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Antes que setup-node: `cache: pnpm` necesita el binario ya instalado.
      # Sin version, action-setup lee `packageManager` del package.json raiz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gates
        run: pnpm turbo build typecheck lint test size check:slots check:contrast check:docs check:budget --continue

  # El noveno gate: axe sobre todas las stories. Va en su propio job porque
  # necesita el navegador de Playwright, y porque un fallo suyo no debe tapar un
  # lint roto: son senales distintas y conviene verlas a la vez.
  #
  # Paga otra vez el build —no hay cache remota configurada—, pero en paralelo:
  # cuesta computo, no reloj.
  a11y:
    name: axe sobre las stories
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: a11y-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright
        run: pnpm --filter playground-web exec playwright install --with-deps chromium

      # El test-runner decide entre axe y capturas por `npm_lifecycle_event`
      # (.storybook/test-runner.ts). Aqui vale `a11y`, asi que el gate visual
      # queda apagado por construccion — no por una variable que se pueda
      # olvidar.
      - name: a11y
        run: pnpm turbo a11y

  # El gate de regresion visual NO corre aqui, y no por olvido.
  #
  # Compara pixeles contra un baseline versionado POR PLATAFORMA
  # (apps/playground-web/__snapshots__/visual/<plataforma>/), y hoy solo existe
  # el de win32: en un runner Linux no habria contra que comparar. Y generar uno
  # tampoco lo cierra — el antialiasing y la sintesis de fuentes difieren entre
  # maquinas mas que el umbral del 0,1 % que fija ADR-112, asi que el gate
  # empezaria a dar falsos positivos y en dos semanas nadie lo miraria.
  #
  # Cerrarlo pide una de dos, y las dos son decision aparte (ADR-037 §3 pide un
  # «entorno unico» y no dice cual):
  #   - generar el baseline DENTRO de un contenedor fijo, que pasa a SER ese
  #     entorno unico y sustituye a la maquina de quien lo genera;
  #   - o delegar la captura en un servicio externo.
  #
  # Mientras tanto se corre a mano con `pnpm visual`. Este job existe para que
  # el hueco se vea en cada PR en lugar de desaparecer. Acompana a los gates:
  # recordarlo en cada push corriente seria ruido, recordarlo antes de publicar
  # es justo cuando importa.
  visual-a-mano:
    name: regresion visual — a mano, ver el porque
    if: github.event_name != 'push' || startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Por que este gate no corre en CI
        run: |
          echo "Baseline visual versionado por plataforma; hoy solo existe win32."
          echo "Un runner Linux no tiene contra que comparar, y regenerarlo daria"
          echo "falsos positivos sobre el umbral del 0,1 % (ADR-037 §3, ADR-112)."
          echo "Se corre a mano: pnpm visual"

  # Publica lo que `pnpm release` haya versionado, y SOLO si los gates pasaron.
  #
  # Antes vivia en su propio workflow y corria en paralelo, asi que un catalogo
  # con los tests en rojo podia acabar en npm: el job de release solo hacia
  # `build`. Con `needs` no se publica nada que no haya pasado los ocho gates y
  # axe.
  #
  # Sigue sin hacer falta orquestar tags ni condiciones de version: `changeset
  # publish` es idempotente y solo manda al registro lo que todavia no esta. Lo
  # que cambia con ADR-139 es que ya no llega hasta aqui en cada push: `needs` lo
  # ata a `gates` y `a11y`, y un job cuya dependencia se salta se salta tambien.
  # La idempotencia deja de ser el filtro y pasa a ser la red de seguridad.
  #
  # Su `if` tiene un efecto que conviene tener presente: un dispatch manual corre
  # los diez gates y axe, pero NO publica —solo publica un push a main—, asi que
  # se puede pedir una pasada completa a mitad de trabajo sin tocar el registro.
  publish:
    name: publicar en npm
    needs: [gates, a11y]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish
      cancel-in-progress: false
    # `id-token` firma la procedencia; `contents` es para empujar los tags.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # `setup-node` escribe su .npmrc en un userconfig temporal, y pnpm no siempre lo honra: el
      # token acabaria sin llegar a npm y un PUT sin autenticar a un paquete con scope responde
      # 404, el mismo error que da un permiso insuficiente. Se escribe explicito para que la
      # autenticacion no dependa de como compongan las dos herramientas.
      - name: autenticar contra el registro
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
          echo "@stellaria:registry=https://registry.npmjs.org/" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Antes de intentar publicar, que diga QUIEN es. Sin esto, un token vacio y un token sin
      # permiso dan el mismo 404 y no hay forma de distinguirlos desde el log.
      - name: quien soy en npm
        run: |
          npm whoami || {
            echo "::error::El token no autentica. Revisa el secreto NPM_TOKEN."
            exit 1
          }
          echo "Paquetes a los que este token puede escribir:"
          npm access list packages 2>&1 | head -20 || echo "(el token no puede listar permisos)"

      # El tarball sale de un checkout limpio, no del `dist` que hubiera en una maquina.
      - run: pnpm turbo build --filter=@stellaria/nebula-web...

      # La procedencia se enciende por entorno, no por bandera: `changeset publish` solo acepta
      # `--tag`, `--otp` y `--no-git-tag`, y pasa el resto a `npm publish`, que si lee
      # NPM_CONFIG_PROVENANCE.
      #
      # OJO: con el repositorio PRIVADO npm la omite en silencio, sin fallar. La atestacion va a un
      # registro publico de transparencia, asi que exige repo publico. La variable se deja puesta
      # para que empiece a funcionar sola el dia que el repositorio se abra (ADR-113 lo da por
      # publico; hoy no lo es).
      - name: publicar
        run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: empujar los tags que cree changeset
        run: git push --follow-tags
