name: Gates y publicacion

on:
  push:
    branches: [main]
    tags: ["v*", "force/v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      regenerar_baseline:
        description: "Regenerar el baseline visual en vez de compararlo"
        type: boolean
        default: false

# La concurrencia va POR JOB y no en el workflow: los gates se cancelan cuando
# llega un push nuevo —lo viejo ya no interesa— pero una publicacion a medias no
# se puede cancelar sin dejar la mitad de los paquetes en el registro.
#
# QUE CORRE CUANDO (ADR-139, revisado por ADR-176)
#
# El trabajo esta partido en dos y lo que los separa es el REF del push:
#
#   - push a una rama  → corre SOLO `guardia` (typecheck + lint).
#   - push de un tag `v*` → corren los diez gates, axe, la regresion visual y la
#     publicacion.
#   - PR o dispatch manual → los diez gates y axe, sin publicar.
#
# El tag lo crea `scripts/release.mjs` en la maquina de quien lanza el release,
# no CI, y por eso existe siempre. Antes el marcador era el ASUNTO del commit de
# release y se leia con `startsWith(head_commit.message, 'chore(release):')`. Eso
# fallo dos veces el mismo dia:
#
#   1. Un `fix(themes)` entro encima del commit de release, la cabeza dejo de
#      empezar por el marcador, se saltaron `gates`, `a11y`, `visual` y con ellos
#      `publish` — y el run salio VERDE, porque un job saltado no falla. La 1.0.0
#      se quedo sin publicar sin que nada se pusiera rojo.
#   2. Cuando por fin publico, no dejo tags: `changeset publish` los crea
#      LIGEROS y el paso que los empujaba usaba `git push --follow-tags`, que
#      empuja solo los anotados. Sin tags, `Range()` del script de release no
#      sabe desde donde redactar y recorre el historial entero.
#
#   3. Y con el tag ya como disparador aparecio una tercera, que es la que hay que vigilar:
#      el tag LLEGO y no nacio ningun run. GitHub no crea evento cuando se suben mas de tres
#      tags a la vez, y `git push --tags` subia los seis de changeset mas el `v*` de golpe
#      —siete—. Nada se puso rojo: el tag estaba en el remoto, este fichero era correcto, y en
#      Actions no habia absolutamente nada que mirar. La 1.1.0 se quedo sin publicar asi.
#
# Las dos primeras las cierra el tag: o llega o no llega, y si llega, los jobs de gates no
# tienen condicion que evaluar y no se pueden saltar. El marcador deja de ser una cadena en un
# mensaje y pasa a ser un objeto de git que alguien creo a proposito.
#
# La tercera la cierra `scripts/release.mjs`, empujando el tag disparador SOLO. Y deja una
# regla de diagnostico: si una version no se publica, mira PRIMERO si el run existe, antes de
# buscar un gate en rojo que no esta.

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Lo barato en cada push: los dos gates que atrapan la mayoria de los errores
  # —un tipo que no cierra, una regla de lint— sin pagar el resto.
  #
  # No es gratis: `typecheck` y `lint` dependen de `^build` (turbo.json), asi que
  # construye los paquetes de los que cada workspace depende. Lo que se ahorra
  # frente a la pasada completa es todo lo demas: el build de las apps, el
  # prerenderizado de Next, storybook-static, Chromium, los tests, size-limit y
  # los dos presupuestos.
  guardia:
    name: typecheck · lint
    if: >-
      github.event_name == 'push'
      && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/force/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: guardia-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Guardia
        run: pnpm turbo typecheck lint --continue

  # Ocho de los nueve gates de docs/03 §4, en una sola pasada de turbo.
  #
  # `--continue` es deliberado: sin el, turbo para en el primer fallo y quien
  # abre el PR descubre los gates de uno en uno, un push por gate. Con el, la
  # primera vuelta ya dice todo lo que hay que arreglar.
  gates:
    name: build · typecheck · lint · test · size · slots · contrast · docs · budget
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: gates-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Antes que setup-node: `cache: pnpm` necesita el binario ya instalado.
      # Sin version, action-setup lee `packageManager` del package.json raiz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gates
        run: pnpm turbo build typecheck lint test size check:slots check:contrast check:docs check:budget --continue

      # Fuera de turbo: cruza apps/ y packages/, asi que no es una tarea por
      # paquete. Sin el, olvidar `styles.css` en un consumidor no da error —
      # los estilos se pintan y el orden de las capas lo decide el bundler.
      - name: Capas CSS
        if: always()
        run: pnpm check:layers

  # El noveno gate: axe sobre todas las stories. Va en su propio job porque
  # necesita el navegador de Playwright, y porque un fallo suyo no debe tapar un
  # lint roto: son senales distintas y conviene verlas a la vez.
  #
  # Paga otra vez el build —no hay cache remota configurada—, pero en paralelo:
  # cuesta computo, no reloj.
  a11y:
    name: axe sobre las stories
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: a11y-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Playwright
        run: pnpm --filter playground-web exec playwright install --with-deps chromium

      # El test-runner decide entre axe y capturas por `npm_lifecycle_event`
      # (.storybook/test-runner.ts). Aqui vale `a11y`, asi que el gate visual
      # queda apagado por construccion — no por una variable que se pueda
      # olvidar.
      - name: a11y
        run: pnpm turbo a11y

  # El gate 8 — regresion visual. Corre aqui desde ADR-149.
  #
  # Lo que lo tenia parado era que el aspecto dependia de la maquina: el baseline
  # solo existia para win32 y regenerarlo en otra parte daba falsos positivos por
  # encima del umbral del 0,1 %. La causa concreta eran las fuentes del host, y
  # ADR-148 la quito de en medio — el playground sirve su propia Geist.
  #
  # Lo que quedaba por fijar era el navegador, y eso lo hace la imagen oficial de
  # Playwright usada como contenedor del job. Anclada POR DIGEST: la etiqueta se
  # mueve y el digest no, y una actualizacion silenciosa repintaria las 78
  # laminas sin que nadie supiera por que.
  #
  # La version no es libre: playground-web resuelve playwright@1.61.1 y la imagen
  # trae ese Chromium. Subir uno obliga a subir el otro EN EL MISMO PR, y a
  # regenerar el baseline.
  #
  # OJO en la primera pasada: no existe __snapshots__/visual/linux/, asi que esta
  # genera las 78 laminas en vez de compararlas. Se descargan del artefacto y se
  # comprometen; hasta entonces el gate esta armado pero vacio.
  visual:
    name: regresion visual (contenedor anclado)
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      # La imagen deja los navegadores en /ms-playwright, pero Actions fija
      # HOME=/github/home en los jobs con contenedor y Playwright cae a su camino
      # por defecto —$HOME/.cache/ms-playwright—, que esta vacio. El primer
      # intento fallo justo asi, buscando chromium_headless_shell-1228 ahi.
      # Decirlo explicito quita la ambiguedad en vez de confiar en que el ENV de
      # la imagen sobreviva al runner.
      env:
        PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    concurrency:
      group: visual-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Sin baseline, `jest-image-snapshot` falla una vez por lamina ausente: 75
      # errores identicos que dicen «New snapshot was not written» y ni uno que
      # diga que falta la carpeta. Se comprueba antes y se dice en una linea.
      - name: hay baseline?
        if: ${{ !inputs.regenerar_baseline }}
        run: |
          if [ ! -d apps/playground-web/__snapshots__/visual/linux ]; then
            echo "::error::No hay baseline en apps/playground-web/__snapshots__/visual/linux."
            echo "::error::Lanza este workflow con «Regenerar el baseline visual» marcado,"
            echo "::error::baja el artefacto visual-linux y comprometelo en esa ruta."
            exit 1
          fi
          echo "Baseline presente: $(ls apps/playground-web/__snapshots__/visual/linux | wc -l) laminas."

      # La imagen ya trae el navegador; `playwright install` aqui solo lo
      # volveria a descargar y a desanclar lo que el digest fija.
      #
      # `jest-image-snapshot` NO escribe capturas nuevas en CI —jest pone
      # `ci: true` al detectar el entorno y eso vuelve 'none' el modo de
      # actualizacion—, asi que la primera pasada fallaba con 75 «New snapshot
      # was not written» en vez de generar el baseline. Regenerar es una accion
      # deliberada y se pide por su interruptor, no un efecto secundario de que
      # falte un fichero: si se generara solo, cualquier story nueva entraria en
      # el baseline sin que nadie la mirara, y el gate dejaria de significar
      # nada.
      - name: visual
        run: |
          echo "regenerar_baseline = '${{ inputs.regenerar_baseline }}'"
          echo "tarea               = ${{ inputs.regenerar_baseline && 'visual:update' || 'visual' }}"
          echo "process.platform    = $(node -p process.platform)"
          pnpm turbo ${{ inputs.regenerar_baseline && 'visual:update' || 'visual' }}

      # Regenerar y no dejar carpeta es un fallo silencioso: el job sale verde,
      # el artefacto viaja con lo que ya habia y uno cree tener baseline. Paso
      # cuando `visual:update` no escribio nada y nadie se entero hasta abrir el
      # zip. Se comprueba y se dice.
      - name: se escribio el baseline?
        if: ${{ always() && inputs.regenerar_baseline }}
        run: |
          echo "Contenido de __snapshots__/visual:"
          ls -la apps/playground-web/__snapshots__/visual/ || true
          plat=$(node -p process.platform)
          dir="apps/playground-web/__snapshots__/visual/$plat"
          if [ ! -d "$dir" ]; then
            echo "::error::Se pidio regenerar y no existe $dir."
            echo "::error::La tarea no escribio capturas. Revisa el log de test-storybook."
            exit 1
          fi
          echo "::notice::Baseline escrito en $dir: $(ls "$dir" | wc -l) laminas."

      # `always()` es lo que importa: cuando el gate falla, las capturas nuevas y
      # los diffs son justamente lo que hay que mirar.
      - name: laminas y diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-linux
          path: apps/playground-web/__snapshots__/visual/
          if-no-files-found: error

  # Publica lo que `pnpm release` haya versionado, y SOLO si los gates pasaron.
  #
  # Antes vivia en su propio workflow y corria en paralelo, asi que un catalogo
  # con los tests en rojo podia acabar en npm: el job de release solo hacia
  # `build`. Con `needs` no se publica nada que no haya pasado los ocho gates y
  # axe.
  #
  # `changeset publish` es idempotente y solo manda al registro lo que todavia no
  # esta, asi que la idempotencia no es el filtro sino la red de seguridad: el
  # filtro es `needs`, y un job cuya dependencia se salta se salta tambien.
  #
  # Publica SOLO un push de tag `v*` (ADR-176). Un dispatch manual y un PR corren
  # los diez gates y axe pero NO publican, asi que se puede pedir una pasada
  # completa a mitad de trabajo sin tocar el registro.
  #
  # `--no-git-tag` porque los tags ya existen: los crea y los empuja
  # `scripts/release.mjs` antes de que este workflow arranque, y son justamente
  # lo que lo arranca. Que CI los creara era el orden al reves —el que publica
  # deja el marcador de lo que publico— y ademas no funcionaba: los creaba
  # ligeros y los empujaba con `--follow-tags`, que solo empuja anotados.
  publish:
    name: publicar en npm
    needs: [guardia, gates, a11y, visual]
    # Un job SALTADO no falla, y por ahi se colo el incidente 1: `needs` por si solo deja pasar
    # lo que no llego a correr. Aqui se exige `success` explicito en la via normal, asi que un
    # gate que se salte —por la razon que sea— bloquea la publicacion en vez de bendecirla.
    #
    # La via de force es la excepcion DECLARADA: la pide el tag `force/v*`, que alguien escribe a
    # proposito, y a cambio solo tiene `guardia` detras. No hay forma de llegar aqui por accidente.
    if: >-
      !cancelled()
      && (
        (startsWith(github.ref, 'refs/tags/v')
          && needs.gates.result == 'success'
          && needs.a11y.result == 'success'
          && needs.visual.result == 'success')
        || (startsWith(github.ref, 'refs/tags/force/v')
          && needs.guardia.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: publish
      cancel-in-progress: false
    # `id-token` firma la procedencia. `contents: read` basta desde ADR-176: los
    # tags ya no se crean aqui.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # `setup-node` escribe su .npmrc en un userconfig temporal, y pnpm no siempre lo honra: el
      # token acabaria sin llegar a npm y un PUT sin autenticar a un paquete con scope responde
      # 404, el mismo error que da un permiso insuficiente. Se escribe explicito para que la
      # autenticacion no dependa de como compongan las dos herramientas.
      - name: autenticar contra el registro
        run: |
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
          echo "@stellaria:registry=https://registry.npmjs.org/" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Antes de intentar publicar, que diga QUIEN es. Sin esto, un token vacio y un token sin
      # permiso dan el mismo 404 y no hay forma de distinguirlos desde el log.
      - name: quien soy en npm
        run: |
          npm whoami || {
            echo "::error::El token no autentica. Revisa el secreto NPM_TOKEN."
            exit 1
          }
          echo "Paquetes a los que este token puede escribir:"
          npm access list packages 2>&1 | head -20 || echo "(el token no puede listar permisos)"

      # El tarball sale de un checkout limpio, no del `dist` que hubiera en una maquina.
      - run: pnpm turbo build --filter=@stellaria/nebula-web...

      # La procedencia se enciende por entorno, no por bandera: `changeset publish` solo acepta
      # `--tag`, `--otp` y `--no-git-tag`, y pasa el resto a `npm publish`, que si lee
      # NPM_CONFIG_PROVENANCE.
      #
      # OJO: con el repositorio PRIVADO npm la omite en silencio, sin fallar. La atestacion va a un
      # registro publico de transparencia, asi que exige repo publico. La variable se deja puesta
      # para que empiece a funcionar sola el dia que el repositorio se abra (ADR-113 lo da por
      # publico; hoy no lo es).
      - name: publicar
        run: pnpm exec changeset publish --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
